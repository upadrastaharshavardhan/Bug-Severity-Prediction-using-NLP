project:
  name: "ai-bug-severity-prediction"
  version: "1.0.0"

paths:
  data_dir: "data"
  artifacts_dir: "artifacts"
  raw_data: "data/bugs.csv"
  embeddings: "artifacts/embeddings.npy"
  classifier: "artifacts/classifier.joblib"
  metadata: "artifacts/metadata.csv"

data:
  n_samples: 4000
  random_seed: 42
  test_size: 0.2

severities:
  - Critical
  - High
  - Medium
  - Low

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 64
  device: "cuda"
  normalize: true

classifier:
  type: "logistic"
  max_iter: 1000
  class_weight: "balanced"
  n_estimators: 200
  random_state: 42

preprocessing:
  max_text_length: 1000

gradio:
  title: "Bug Severity Predictor"
  description: "Predict Critical / High / Medium / Low from bug title and description."
  share: false
